name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica o index.html
        run: test -f index.html
      - name: Build da imagem
        run: docker build -t site-teste .